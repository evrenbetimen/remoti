[package]
name = "remoti-core"
description = "Remoti agent: capture, encode, E2EE QUIC transport, input injection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "remoti_core"
path = "src/lib.rs"

[[bin]]
name = "remoti-agent"
path = "src/main.rs"

[features]
default = ["h264", "av1"]
# Software H.264 via OpenH264 (compiled from source; no system dependency).
h264 = ["dep:openh264"]
# Software AV1 via rav1e (pure Rust).
av1 = ["dep:rav1e"]
# rav1e SIMD kernels (needs `nasm` on x86_64); used for release builds.
av1-asm = ["av1", "rav1e/asm"]

[dependencies]
remoti-proto.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
tokio-tungstenite.workspace = true
ring.workspace = true
spake2.workspace = true
ml-kem.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
xxhash-rust.workspace = true
rav1e = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
